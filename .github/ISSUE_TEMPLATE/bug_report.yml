name: Bug Report
description: Report a bug in django-recur, the compatibility layer, or the Web Component widget.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug in **django-recur**!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Provide a code snippet, RFC 8984 JSON payload, or RFC 5545 RRULE string that reproduces the issue.
      placeholder: |
        ```python
        from django_recur.rfc8984 import JSCalendarRecurrence
        ...
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "django_recur (RFC 8984 JSCalendar Engine)"
        - "django_recur (RFC 5545 Parser / Mapper)"
        - "recurrence (django-recurrence Compatibility Layer)"
        - "Django Model Fields / Forms"
        - "migrate_recurrences Management Command"
        - "TypeScript Web Component Widget (<django-recur-widget>)"
        - "Documentation"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment (Python, Django, django-recur versions)
      placeholder: "Python 3.12, Django 5.1, django-recur 2.0.0"
    validations:
      required: true
