[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-recur"
version = "2.0.0"
description = "Modern RFC 8984 (JSCalendar) & RFC 5545 reimplementation of django-recurrence with drop-in compatibility and Web Component widgets."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [
    { name = "Lino Helms", email = "lino@lino.io" },
    { name = "Tamas Kemenczy", email = "tamas.kemenczy@gmail.com" },
]
maintainers = [
    { name = "Lino Helms", email = "lino@lino.io" },
]
keywords = [
    "django",
    "recurrence",
    "jscalendar",
    "rfc8984",
    "rfc5545",
    "icalendar",
    "rrule",
    "dateutil",
    "calendar",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "django>=4.2",
    "python-dateutil>=2.8.2",
]

[project.urls]
Homepage = "https://github.com/lino/django-recur"
Documentation = "https://lino.github.io/django-recur/"
Repository = "https://github.com/lino/django-recur"
Issues = "https://github.com/lino/django-recur/issues"
Changelog = "https://github.com/lino/django-recur/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-django>=4.9.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "django-stubs>=5.1.0",
    "types-python-dateutil>=2.9.0",
    "zensical>=0.0.1",
    "mkdocstrings>=0.27.0",
    "mkdocstrings-python>=1.12.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/django_recur",
    "src/recurrence",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/frontend",
    "/zensical.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers -ra --cov=django_recur --cov=recurrence --cov-report=term-missing"

[tool.coverage.run]
source = ["src/django_recur", "src/recurrence"]
branch = true
omit = [
    "src/recurrence/migrations/*",
    "src/django_recur/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"src/recurrence/__init__.py" = ["F401"]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["django_recur", "recurrence"]
strict = false
warn_unused_ignores = false
warn_return_any = false
check_untyped_defs = true
ignore_missing_imports = true
